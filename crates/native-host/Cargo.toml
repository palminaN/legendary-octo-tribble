[package]
name = "dm-native-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dm-native-host"
path = "src/main.rs"

[dependencies]
dm-core = { path = "../core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "6"
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading"] }
