<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Download</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #202124;
        --muted: #5f6368;
        --border: #dadce0;
        --field: #f1f3f4;
        --accent: #1a73e8;
        --track: #e8eaed;
        --error: #c5221f;
        --ok: #188038;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #202124;
          --fg: #e8eaed;
          --muted: #9aa0a6;
          --border: #3c4043;
          --field: #303134;
          --accent: #8ab4f8;
          --track: #3c4043;
          --error: #f28b82;
          --ok: #81c995;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.4 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #source {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12px; }
      .folder { display: flex; gap: 8px; }
      #folder {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--field);
        color: var(--fg);
        font: inherit;
      }
      button {
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button.primary { border-color: var(--accent); background: var(--accent); color: var(--bg); font-weight: 600; }
      button:disabled { opacity: 0.5; cursor: default; }
      progress {
        width: 100%;
        height: 10px;
        margin: 4px 0 6px;
        accent-color: var(--accent);
      }
      #stats { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
      #status { margin: 10px 0 0; overflow-wrap: anywhere; }
      #status.error { color: var(--error); }
      #status.done { color: var(--ok); }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1 id="name">Loading…</h1>
    <p id="source"></p>

    <section id="setup">
      <label for="folder">Save to</label>
      <div class="folder">
        <input id="folder" type="text" readonly />
        <button id="browse" type="button">Browse…</button>
      </div>
    </section>

    <section id="transfer" hidden>
      <progress id="bar"></progress>
      <div id="stats"><span id="amount"></span><span id="speed"></span></div>
    </section>

    <p id="status"></p>

    <div class="actions">
      <button id="reveal" type="button" hidden>Open folder</button>
      <button id="cancel" type="button">Cancel</button>
      <button id="start" type="button" class="primary" disabled>Start download</button>
    </div>
    <script src="download.js"></script>
  </body>
</html>
