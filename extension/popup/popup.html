<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Download Manager</title>
    <style>
      body { font-family: sans-serif; width: 320px; padding: 8px; margin: 0; }
      #status { margin: 0 0 8px; color: #555; font-size: 12px; }
      h2 { font-size: 13px; margin: 0 0 6px; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-top: 1px solid #ddd; }
      .kind { flex: none; padding: 1px 5px; border-radius: 3px; background: #1a73e8; color: #fff; font-size: 10px; font-weight: 600; }
      .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
      .detail { color: #777; }
      button { flex: none; font-size: 12px; cursor: pointer; }
      #empty { font-size: 12px; color: #777; }
    </style>
  </head>
  <body>
    <p id="status">checking native host…</p>
    <p id="permission" hidden>
      Video detection needs access to all websites.
      <button id="grant" type="button">Grant access</button>
    </p>
    <h2>Media on this page</h2>
    <ul id="media"></ul>
    <p id="empty" hidden>No video detected yet — start playing the video.</p>
    <script src="popup.js"></script>
  </body>
</html>
